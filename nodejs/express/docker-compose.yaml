name: nodejs-project
services:
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-project
    restart: unless-stopped

    ports:
      - "5440:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs_project

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
